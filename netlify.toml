[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# React Router / SPA deep links
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  # Vite variables (VITE_*) are intentionally baked into the client bundle.
  # VITE_API_URL is not a secret; allowlist it so Netlify secrets scanning doesn't fail the build.
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_URL"
