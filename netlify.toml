[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# React Router / SPA deep links
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
